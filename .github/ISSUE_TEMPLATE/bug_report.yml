name: "Bug Report"
description: "File an issue to report unexpected behavior or errors in Art Wallpaper."
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please ensure you have checked the [Troubleshooting Guide](../DEVELOPMENT.md) before submitting.

  - type: input
    id: version
    attributes:
      label: "Art Wallpaper Version"
      description: "Which version are you running? (e.g. v4.1.7)"
      placeholder: "v4.1.7"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: "Operating System"
      description: "Which operating system are you using?"
      options:
        - "Windows 11"
        - "Windows 10"
        - "macOS Sonoma (14.x) or later"
        - "macOS Ventura (13.x)"
        - "macOS Monterey (12.x)"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "Steps to reproduce the behavior."
      placeholder: |
        1. Open Art Wallpaper
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Application Logs"
      description: "Relevant log traces from ~/.artwallpaper/logs/error.log or app.log"
      render: text
    validations:
      required: false
