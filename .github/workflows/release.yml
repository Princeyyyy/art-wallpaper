name: Release

# Manually triggered — you decide when new code warrants a release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 4.1.0) — must be valid 3-part semver'
        required: true
        type: string
        default: '4.0.0'
      release_notes:
        description: 'Release notes (supports markdown)'
        required: false
        default: 'ArtWallpaper — Cross-platform Windows & macOS release.'
        type: string
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        default: false
        type: boolean

jobs:
  # ─── 1. Run tests across both Windows and macOS ────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download & Verify Gradle Distribution (with retry)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --version && break || (echo "Gradle download attempt $i failed, retrying in 5s..." && sleep 5)
          done

      - name: Run tests
        shell: bash
        run: |
          RAW="${{ inputs.version }}"
          RAW="${RAW#v}"
          RAW="${RAW#V}"
          IFS='.' read -r -a PARTS <<< "$RAW"
          V="${PARTS[0]:-4}.${PARTS[1]:-0}.${PARTS[2]:-0}"
          ./gradlew test -PappVersion=$V

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: build/reports/tests/
          retention-days: 14

  # ─── 2. Build Windows MSI Installer ─────────────────────────────────────────
  build-windows:
    name: Build Windows MSI
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download & Verify Gradle Distribution (with retry)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --version && break || (echo "Gradle download attempt $i failed, retrying in 5s..." && sleep 5)
          done

      - name: Update gradle.properties & version.properties
        shell: pwsh
        run: |
          $raw = "${{ inputs.version }}".Trim().TrimStart('v', 'V')
          $parts = $raw.Split('.') | Where-Object { $_ -match '^\d+' }
          $major = if ($parts.Count -gt 0) { $parts[0] } else { "4" }
          $minor = if ($parts.Count -gt 1) { $parts[1] } else { "0" }
          $patch = if ($parts.Count -gt 2) { $parts[2] } else { "0" }
          $v = "$major.$minor.$patch"
          # gradle.properties — build-time single source of truth
          $gp = Get-Content gradle.properties -Raw
          $gp = $gp -replace '(?<=appVersion=)[^\r\n]*', $v
          [System.IO.File]::WriteAllText("$PWD\gradle.properties", $gp)
          # version.properties — runtime single source of truth
          $vp = Get-Content src\main\resources\version.properties -Raw
          $vp = $vp -replace '(?<=version=)[^\r\n]*', $v
          [System.IO.File]::WriteAllText("$PWD\src\main\resources\version.properties", $vp)
          Write-Output "Version normalized and bumped to $v"

      - name: Package Windows MSI
        shell: pwsh
        run: |
          $raw = "${{ inputs.version }}".Trim().TrimStart('v', 'V')
          $parts = $raw.Split('.') | Where-Object { $_ -match '^\d+' }
          $major = if ($parts.Count -gt 0) { $parts[0] } else { "4" }
          $minor = if ($parts.Count -gt 1) { $parts[1] } else { "0" }
          $patch = if ($parts.Count -gt 2) { $parts[2] } else { "0" }
          $v = "$major.$minor.$patch"
          .\gradlew packageMsi -PappVersion=$v

      - name: Locate and stage MSI artifact
        shell: pwsh
        run: |
          $raw = "${{ inputs.version }}".Trim().TrimStart('v', 'V')
          $parts = $raw.Split('.') | Where-Object { $_ -match '^\d+' }
          $major = if ($parts.Count -gt 0) { $parts[0] } else { "4" }
          $minor = if ($parts.Count -gt 1) { $parts[1] } else { "0" }
          $patch = if ($parts.Count -gt 2) { $parts[2] } else { "0" }
          $v = "$major.$minor.$patch"
          $f = Get-ChildItem -Path build -Filter "*.msi" -Recurse | Select-Object -First 1
          if (-not $f) { throw "MSI artifact not found" }
          New-Item -ItemType Directory -Force "dist-windows" | Out-Null
          Copy-Item $f.FullName "dist-windows\ArtWallpaper-$v-Windows.msi"
          Write-Output "MSI staged: dist-windows\ArtWallpaper-$v-Windows.msi"

      - name: Upload Windows MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-msi
          path: dist-windows/
          retention-days: 7

  # ─── 3. Build macOS DMG Installer ───────────────────────────────────────────
  build-macos:
    name: Build macOS DMG
    needs: test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download & Verify Gradle Distribution (with retry)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --version && break || (echo "Gradle download attempt $i failed, retrying in 5s..." && sleep 5)
          done

      - name: Update gradle.properties & version.properties
        run: |
          RAW="${{ inputs.version }}"
          RAW="${RAW#v}"
          RAW="${RAW#V}"
          IFS='.' read -r -a PARTS <<< "$RAW"
          MAJOR="${PARTS[0]:-4}"
          MINOR="${PARTS[1]:-0}"
          PATCH="${PARTS[2]:-0}"
          V="$MAJOR.$MINOR.$PATCH"
          # gradle.properties
          sed -i.bak "s/^appVersion=.*/appVersion=$V/" gradle.properties
          # version.properties
          sed -i.bak "s/^version=.*/version=$V/" src/main/resources/version.properties
          echo "Version normalized and bumped to $V"

      - name: Package macOS DMG
        run: |
          RAW="${{ inputs.version }}"
          RAW="${RAW#v}"
          RAW="${RAW#V}"
          IFS='.' read -r -a PARTS <<< "$RAW"
          V="${PARTS[0]:-4}.${PARTS[1]:-0}.${PARTS[2]:-0}"
          ./gradlew packageDmg -PappVersion=$V

      - name: Locate and stage DMG artifact
        run: |
          RAW="${{ inputs.version }}"
          RAW="${RAW#v}"
          RAW="${RAW#V}"
          IFS='.' read -r -a PARTS <<< "$RAW"
          V="${PARTS[0]:-4}.${PARTS[1]:-0}.${PARTS[2]:-0}"
          mkdir -p dist-macos
          DMG=$(find build -name "*.dmg" | head -n 1)
          if [ -z "$DMG" ]; then
            echo "ERROR: DMG artifact not found!"
            exit 1
          fi
          cp "$DMG" "dist-macos/ArtWallpaper-$V-macOS.dmg"
          echo "DMG staged: dist-macos/ArtWallpaper-$V-macOS.dmg"

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dmg
          path: dist-macos/
          retention-days: 7

  # ─── 4. Publish GitHub Release with both MSI and DMG ────────────────────────
  publish-release:
    name: Publish Multi-Platform Release
    needs: [ build-windows, build-macos ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows MSI artifact
        uses: actions/download-artifact@v4
        with:
          name: release-msi
          path: release-artifacts/

      - name: Download macOS DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: release-dmg
          path: release-artifacts/

      - name: List release binaries
        run: ls -lh release-artifacts/

      - name: Commit version bump & tag
        run: |
          RAW="${{ inputs.version }}"
          RAW="${RAW#v}"
          RAW="${RAW#V}"
          IFS='.' read -r -a PARTS <<< "$RAW"
          MAJOR="${PARTS[0]:-4}"
          MINOR="${PARTS[1]:-0}"
          PATCH="${PARTS[2]:-0}"
          V="$MAJOR.$MINOR.$PATCH"
          sed -i "s/^appVersion=.*/appVersion=$V/" gradle.properties
          sed -i "s/^version=.*/version=$V/" src/main/resources/version.properties
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties src/main/resources/version.properties
          git diff --staged --quiet || git commit -m "chore: bump version to $V for release"
          git tag -f "v$V"
          git push origin master --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: ArtWallpaper v${{ inputs.version }}
          body: ${{ inputs.release_notes }}
          files: release-artifacts/*
          prerelease: ${{ inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
