name: Release

# Manually triggered — you decide when new code warrants a release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 3.4.0) — must be a valid MSI version (3 numbers)'
        required: true
        type: string
      release_notes:
        description: 'Release notes (supports markdown)'
        required: false
        default: 'Bug fixes and improvements.'
        type: string
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        default: false
        type: boolean

jobs:
  # ─── 1. Run tests first — never ship broken code ───────────────────────────
  test:
    name: Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: .\gradlew test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-release
          path: build/reports/tests/
          retention-days: 30

  # ─── 2. Build MSI and publish GitHub Release ───────────────────────────────
  build-and-release:
    name: Build MSI & Publish Release
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history so we can push the version-bump commit
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bump version in build.gradle.kts
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          $content = Get-Content build.gradle.kts -Raw
          # Top-level version
          $content = $content -replace '(?<=^version = ")[^"]*', $v
          # nativeDistributions versions
          $content = $content -replace '(?<=packageVersion = ")[^"]*', $v
          $content = $content -replace '(?<=msiPackageVersion = ")[^"]*', $v
          $content = $content -replace '(?<=exePackageVersion = ")[^"]*', $v
          [System.IO.File]::WriteAllText("$PWD\build.gradle.kts", $content)
          Write-Output "Bumped to $v"

      - name: Build MSI installer
        run: .\gradlew packageMsi

      - name: Locate MSI artifact
        id: msi
        shell: pwsh
        run: |
          $f = Get-ChildItem -Path build -Filter "*.msi" -Recurse | Select-Object -First 1
          if (-not $f) { throw "MSI not found — packageMsi step may have failed" }
          "path=$($f.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$($f.Name)"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Output "MSI: $($f.FullName)"

      - name: Commit version bump and create tag
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build.gradle.kts
          git commit -m "chore: bump version to ${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin master
          git push origin "v${{ inputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: ArtWallpaper v${{ inputs.version }}
          body: ${{ inputs.release_notes }}
          files: ${{ steps.msi.outputs.path }}
          prerelease: ${{ inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
