name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download & Verify Gradle Distribution (with retry)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --version && break || (echo "Gradle download attempt $i failed, retrying in 5s..." && sleep 5)
          done

      - name: Compile Kotlin
        run: ./gradlew compileKotlin

      - name: Run unit & integration tests
        run: ./gradlew test

      - name: Package macOS App Bundle and Run Smoke Test
        if: runner.os == 'macOS'
        run: |
          ./gradlew createDistributable
          APP_PATH=$(find build/compose/binaries/main -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app bundle not found!"
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          echo "Verifying Info.plist..."
          plutil -lint "$APP_PATH/Contents/Info.plist"
          echo "Verifying JLink JRE release modules..."
          cat "$APP_PATH/Contents/runtime/release"
          echo "Executing native binary with --smoke-test..."
          "$APP_PATH/Contents/MacOS/Art Wallpaper" --smoke-test

      - name: Package Windows App and Run Smoke Test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\gradlew createDistributable
          $exe = Get-ChildItem -Path build\compose\binaries\main -Filter "*.exe" -Recurse | Where-Object { $_.FullName -notmatch "jpackage" } | Select-Object -First 1
          if (-not $exe) {
            Write-Error "ERROR: Executable not found!"
            exit 1
          }
          Write-Host "Found executable at: $($exe.FullName)"
          & $exe.FullName --smoke-test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: build/reports/tests/
          retention-days: 14

  web-ci:
    name: Web App CI (Next.js & TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type check (tsc)
        working-directory: web
        run: npx tsc --noEmit

      - name: Build Next.js application
        working-directory: web
        run: npm run build
