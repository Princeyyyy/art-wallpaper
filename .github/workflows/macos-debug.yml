name: macOS Interactive Debug

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to inspect'
        required: true
        default: 'master'

jobs:
  interactive-macos:
    name: Interactive macOS Runner
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Pre-build App Distribution
        run: ./gradlew createDistributable

      - name: Launch Interactive Terminal (SSH / Web Shell)
        uses: mxschmitt/action-tmate@v3
        with:
          detached: false
